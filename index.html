<!doctype html>
<html lang="zh-CN">
<head>

  <meta name="color-scheme" content="dark" />
  <meta name="theme-color" content="#090a0f" />
  <title>Nice to meet you. · 个人主页</title>

<body>
  <div class="container starfield" aria-hidden="true">
    <div id="stars"></div>

          <div class="bubble-system" aria-hidden="true"><div class="bubble bubble-1"></div><div class="bubble bubble-2"></div><div class="bubble bubble-3"></div><div class="bubble bubble-4"></div><div class="bubble bubble-5"></div><div class="bubble bubble-6"></div></div>
          <div class="text-content" aria-hidden="true">

            <p class="text-confirmed"><span class="char" style="--i:0">正</span><span class="char" style="--i:1">在</span><span class="char" style="--i:2">进</span><span class="char" style="--i:3">入</span></p>
          </div>
          <div class="swipe-handle" aria-hidden="true">
            <div class="handle-glow"></div>
            <svg class="icon-lock" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" focusable="false"><path fill="currentColor" d="M6 22q-.825 0-1.412-.587T4 20V10q0-.825.588-1.412T6 8h1V6q0-2.075 1.463-3.537T12 1t3.538 1.463T17 6v2h1q.825 0 1.413.588T20 10v10q0 .825-.587 1.413T18 22zm0-2h12V10H6zm6-3q.825 0 1.413-.587T14 15t-.587-1.412T12 13t-1.412.588T10 15t.588 1.413T12 17M9 8h6V6q0-1.25-.875-2.125T12 3t-2.125.875T9 6zM6 20V10z" /></svg>
            <svg class="icon-unlock" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" focusable="false"><path fill="currentColor" d="M12 2c1.091 0 2.117.292 3 .804a1 1 0 1 1-1 1.73A4 4 0 0 0 8 8l11 .001a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V10a2 2 0 0 1 2-2h1a6 6 0 0 1 6-6m7 8H5v10h14zm-7 2a2 2 0 0 1 1.134 3.647l-.134.085V17a1 1 0 0 1-1.993.117L11 17v-1.268A2 2 0 0 1 12 12m7.918-6.979l.966.26a1 1 0 0 1-.518 1.93l-.965-.258a1 1 0 0 1 .517-1.932M18.633 2.09a1 1 0 0 1 .707 1.225l-.129.482a1 1 0 1 1-1.932-.517l.13-.483a1 1 0 0 1 1.224-.707" /></svg>

          <div class="ripple-effect" aria-hidden="true"><div class="ripple ripple-1"></div><div class="ripple ripple-2"></div><div class="ripple ripple-3"></div></div>
        </div>
      </a>
    </div>
